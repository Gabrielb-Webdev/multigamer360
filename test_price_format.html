<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Formato Precios - MultiGamer360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 50px;
            background: #f8f9fa;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>🧪 Test de Formato de Precios</h2>
        <p class="text-muted">Este archivo verifica si el sistema de formato está funcionando</p>
        
        <hr>
        
        <div class="mb-3">
            <label for="test_price" class="form-label">Precio de Prueba (escribe números):</label>
            <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control price-input" id="test_price" placeholder="Escribe: 50000">
                <span class="input-group-text">ARS</span>
            </div>
            <small class="text-muted">Debería mostrar puntos automáticamente: 50.000</small>
        </div>
        
        <div id="results"></div>
        
        <hr>
        
        <h5>Información del Sistema:</h5>
        <div class="result success" id="system-info" style="font-size: 12px;"></div>
        
        <h5 class="mt-3">Log de Eventos:</h5>
        <div class="result" id="event-log" style="font-size: 11px; max-height: 200px; overflow-y: auto;"></div>
    </div>

<script>
// Sistema de logging
const eventLog = document.getElementById('event-log');
const systemInfo = document.getElementById('system-info');
const results = document.getElementById('results');

function log(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
    eventLog.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
    eventLog.scrollTop = eventLog.scrollHeight;
}

// Información del sistema
systemInfo.innerHTML = `
    <strong>Navegador:</strong> ${navigator.userAgent}<br>
    <strong>Fecha/Hora:</strong> ${new Date().toLocaleString()}<br>
    <strong>URL:</strong> ${window.location.href}<br>
    <strong>DOMContentLoaded:</strong> ${document.readyState}
`;

log('🚀 Test iniciado', 'info');

// Función para formatear número con puntos de miles
function formatNumberWithThousands(value) {
    const num = value.replace(/\D/g, '');
    if (!num) return '';
    return parseInt(num, 10).toLocaleString('es-AR').replace(/,/g, '.');
}

function getRawValue(formattedValue) {
    return formattedValue.replace(/\./g, '');
}

// Esperar a que el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {
    log('✅ DOMContentLoaded ejecutado', 'success');
    
    const input = document.getElementById('test_price');
    
    if (!input) {
        log('❌ ERROR: No se encontró el input #test_price', 'error');
        results.innerHTML = '<div class="result error">❌ ERROR: Input no encontrado</div>';
        return;
    }
    
    log('✅ Input encontrado: ' + input.id, 'success');
    
    // Detectar si tiene la clase correcta
    if (input.classList.contains('price-input')) {
        log('✅ Clase price-input presente', 'success');
    } else {
        log('❌ ADVERTENCIA: Falta clase price-input', 'error');
    }
    
    let eventCount = 0;
    
    // Agregar listener de input
    input.addEventListener('input', function(e) {
        eventCount++;
        log(`📝 Evento input #${eventCount} detectado`, 'info');
        
        const oldValue = this.value;
        const cursorPosition = this.selectionStart;
        
        log(`   Valor anterior: "${oldValue}"`, 'info');
        
        const rawValue = getRawValue(this.value);
        this.setAttribute('data-raw-value', rawValue);
        
        log(`   Valor sin formato: "${rawValue}"`, 'info');
        
        const formatted = formatNumberWithThousands(rawValue);
        
        log(`   Valor formateado: "${formatted}"`, 'info');
        
        if (this.value !== formatted) {
            this.value = formatted;
            log(`   ✅ Valor actualizado a: "${formatted}"`, 'success');
            
            results.innerHTML = `
                <div class="result success">
                    <strong>✅ ¡FUNCIONA!</strong><br>
                    Valor raw: ${rawValue}<br>
                    Valor formateado: ${formatted}<br>
                    Eventos procesados: ${eventCount}
                </div>
            `;
        }
    });
    
    log('✅ Event listener agregado correctamente', 'success');
    log('👉 Ahora escribe números en el campo de arriba', 'info');
    
    // Test inicial
    setTimeout(() => {
        log('🧪 Ejecutando test automático...', 'info');
        input.value = '50000';
        input.dispatchEvent(new Event('input', { bubbles: true }));
        log('🧪 Test automático completado', 'success');
    }, 1000);
});

log('📜 Script cargado completamente', 'success');
</script>
</body>
</html>
